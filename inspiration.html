    <script>
      const photos = document.querySelectorAll('.photos .photo');
      const counter = document.querySelector('.photo-counter');
      let updateScheduled = false;

      function updatePhotoCounter() {
        const viewportCenter = window.innerHeight / 2;
        let closestIndex = 0;
        let closestDistance = Infinity;

        photos.forEach((photo, index) => {
          const bounds = photo.getBoundingClientRect();
          const distance = Math.abs(
            bounds.top + bounds.height / 2 - viewportCenter,
          );
          if (distance < closestDistance) {
            closestDistance = distance;
            closestIndex = index;
          }
        });

        counter.textContent = `${closestIndex + 1}/${photos.length}`;
        updateScheduled = false;
      }

      function schedulePhotoCounterUpdate() {
        if (updateScheduled) return;
        updateScheduled = true;
        requestAnimationFrame(updatePhotoCounter);
      }

      schedulePhotoCounterUpdate();
      window.addEventListener('scroll', schedulePhotoCounterUpdate, {
        passive: true,
      });
      window.addEventListener('resize', schedulePhotoCounterUpdate);
      window.addEventListener('load', schedulePhotoCounterUpdate);
    </script>
